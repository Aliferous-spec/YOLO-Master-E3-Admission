name: CI

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          # CPU-only torch: the unit tests never leave the CPU path.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Unit tests import routing helpers (e.g. ultralytics.nn.modules.routing_protocol)
          # from the locked YOLO-Master baseline recorded in configs/e3_smoke.yaml.
          python -m pip install "ultralytics @ git+https://github.com/Tencent/YOLO-Master.git@3eb6cd914b651a06e2cd08ea87d12c28cab95502"

      - name: Run tests
        run: python -m pytest tests -q --no-header --tb=short

  lint:
    name: lint (ruff check .)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

  evidence:
    name: evidence (--verify-artifacts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify the P0 acceptance manifest
        run: python -m scripts.run_e3_smoke --verify-artifacts artifacts/smoke/smoke-20260905-204546-6c7389
