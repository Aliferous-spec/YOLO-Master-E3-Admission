name: CI

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest (Python 3.9)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml matplotlib pandas seaborn
          # CPU-only torch: the unit tests never leave the CPU path.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Unit tests import routing helpers (e.g. ultralytics.nn.modules.routing_protocol)
          # from the locked YOLO-Master baseline recorded in configs/e3_smoke.yaml.
          python -m pip install "ultralytics @ git+https://github.com/Tencent/YOLO-Master.git@3eb6cd914b651a06e2cd08ea87d12c28cab95502"

      - name: Run tests
        run: python -m pytest tests -q --no-header --tb=short
